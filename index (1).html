
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SST Analysis: Helene & Milton</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background-color: #f0f2f5; }
        header {
            background-color: #2c3e50; color: white; padding: 1rem; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 { margin: 0; font-size: 1.5rem; } 
        h2 { margin: 5px 0 0; font-size: 1rem; font-weight: normal; color: #bdc3c7; }
        nav {
            background-color: #fff; padding: 10px; text-align: center; border-bottom: 1px solid #ddd;
            display: flex; justify-content: center; flex-wrap: wrap; gap: 10px;
        }
        button {
            padding: 8px 16px; cursor: pointer; border: 1px solid #007bff; background-color: white; 
            color: #007bff; border-radius: 20px; font-size: 14px; transition: all 0.3s ease;
        }
        button:hover, button.active {
            background-color: #007bff; color: white;
        }
        #container { flex-grow: 1; position: relative; width: 100%; height: 100%; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
    <script>
        function loadPlot(filename, btn) {
            document.getElementById('viewer').src = filename;
            // Update active button state
            const buttons = document.querySelectorAll('nav button');
            buttons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>
</head>
<body>

<header>
    <h1>Sea Surface Temperature Analysis</h1>
    <h2>Hurricanes Helene & Milton (2024)</h2>
</header>

<nav>
    <button onclick="loadPlot('mean_sst_helene_before.html', this)">Helene: Before</button>
    <button onclick="loadPlot('mean_sst_helene_after.html', this)">Helene: After</button>
    <button onclick="loadPlot('mean_sst_milton_before.html', this)">Milton: Before</button>
    <button onclick="loadPlot('mean_sst_milton_after.html', this)">Milton: After</button>
    <button onclick="loadPlot('mean_sst_overallboth.html', this)" class="active">Overall Period</button>
</nav>

<div id="container">
    <iframe id="viewer" src="mean_sst_overallboth.html" title="SST Plot Viewer"></iframe>
</div>

</body>
</html>
